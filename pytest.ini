[pytest]
testpaths = tests

# rasterio <= 1.5.1 sets ndarray.shape directly, deprecated in NumPy 2.5.
# The warning is attributed to our ds.read() lines but is raised inside rasterio;
# fixed upstream in rasterio 1.5.2. sargeo/__init__.py silences it for non-pytest
# runs, but pytest installs its own filters, so it needs the rule here too.
filterwarnings =
    ignore:Setting the shape on a NumPy array:DeprecationWarning