<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}

  <!-- Hero image: full viewport width, showing only the middle 40% of the
       image height (30% clipped top and bottom). 1920 / (1416 * 0.4) = 3.39 -->
  <style>
    html, body { overflow-x: clip; }
    .hero {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      aspect-ratio: 1920 / 566.4;
      overflow: hidden;
      margin-bottom: 1.5em;
    }
    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      object-fit: cover;
      object-position: center;
    }
  </style>
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- MathJax: kramdown emits \[ ... \] for display math and leaves $ ... $ inline
       (math_engine: none), so both delimiters are handled here. -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
